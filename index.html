<style>
:root{
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#f8f9fc;--surface:#fff;--text:#14172b;--muted:#5b617a;--border:#e4e7f0;
  --accent:#4f46e5;--accent-soft:#eef0ff;--accent-text:#fff;--shadow:0 1px 2px rgba(20,23,43,.05),0 6px 20px rgba(20,23,43,.05);
  --r:14px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0e1020;--surface:#171a30;--text:#eef0fb;--muted:#9aa1c0;--border:#262a48;--accent:#818cf8;--accent-soft:#222650;--accent-text:#0e1020;--shadow:none}}
:root[data-theme="dark"]{
  --bg:#0e1020;--surface:#171a30;--text:#eef0fb;--muted:#9aa1c0;--border:#262a48;--accent:#818cf8;--accent-soft:#222650;--accent-text:#0e1020;--shadow:none}
html{scroll-padding-top:calc(72px + env(safe-area-inset-top,0px));scroll-behavior:smooth}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--text);font-family:"Vazirmatn",Tahoma,"Segoe UI",sans-serif;line-height:1.8;-webkit-text-size-adjust:100%}
a{color:inherit;text-decoration:none}
button,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{width:100%;max-width:1120px;margin-inline:auto;padding-inline:16px}
/* header */
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--border)}
.bar{display:flex;align-items:center;gap:12px;height:64px}
.logo{display:flex;align-items:center;gap:8px;font-weight:800;font-size:1.05rem}
.logo i{display:grid;place-items:center;width:34px;height:34px;border-radius:10px;background:var(--accent);color:var(--accent-text);font-style:normal}
nav{margin-inline-start:auto;display:none;gap:4px}
nav a{padding:6px 12px;border-radius:8px;color:var(--muted);font-weight:500;font-size:.95rem}
nav a:hover{background:var(--accent-soft);color:var(--text)}
.icon-btn{margin-inline-start:auto;width:40px;height:40px;border-radius:10px;border:1px solid var(--border);background:var(--surface);cursor:pointer}
nav+.icon-btn{margin-inline-start:0}
/* hero */
.hero{padding:44px 0 28px;text-align:center}
.badge{display:inline-block;padding:4px 14px;border-radius:99px;background:var(--accent-soft);color:var(--accent);font-size:.85rem;font-weight:500}
h1{font-size:clamp(1.6rem,6vw,2.8rem);line-height:1.5;margin:14px 0 10px;font-weight:800}
.hero p{margin:0 auto 24px;max-width:560px;color:var(--muted)}
.search{position:relative;max-width:560px;margin-inline:auto}
.search input{width:100%;height:54px;padding-inline:48px 16px;border-radius:14px;border:1px solid var(--border);background:var(--surface);box-shadow:var(--shadow);font-size:1rem}
.search span{position:absolute;inset-inline-start:16px;top:50%;transform:translateY(-50%);pointer-events:none}
/* sections */
section{padding:28px 0}
h2{font-size:1.3rem;margin:0 0 16px;font-weight:700}
.grid{display:grid;gap:12px;grid-template-columns:repeat(2,1fr)}
.cat{display:flex;flex-direction:column;align-items:center;gap:6px;padding:18px 10px;border:1px solid var(--border);border-radius:var(--r);background:var(--surface);cursor:pointer;text-align:center;transition:.15s}
.cat:hover,.cat[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.cat b{font-size:.95rem}.cat small{color:var(--muted)}
.emoji{font-size:1.7rem;line-height:1}
.tools{display:grid;gap:12px;grid-template-columns:1fr}
.tool{display:flex;gap:12px;padding:16px;border:1px solid var(--border);border-radius:var(--r);background:var(--surface);box-shadow:var(--shadow);transition:.15s;cursor:pointer;text-align:start;width:100%}
.tool:hover{transform:translateY(-2px);border-color:var(--accent)}
.tool .emoji{display:grid;place-items:center;flex:none;width:46px;height:46px;border-radius:12px;background:var(--accent-soft);font-size:1.4rem}
.tool h3{margin:0;font-size:1rem}
.tool p{margin:2px 0 0;color:var(--muted);font-size:.88rem;line-height:1.7}
.soon{display:inline-block;margin-inline-start:6px;padding:0 8px;border-radius:99px;background:var(--accent-soft);color:var(--accent);font-size:.72rem;font-weight:500}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:12px;margin-bottom:4px}
.chip{flex:none;padding:6px 16px;border-radius:99px;border:1px solid var(--border);background:var(--surface);cursor:pointer;font-size:.9rem}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-text);border-color:var(--accent)}
.empty{padding:32px;text-align:center;color:var(--muted);border:1px dashed var(--border);border-radius:var(--r)}
/* tools system */
.hd{display:flex;align-items:end;justify-content:space-between;gap:12px;margin-bottom:16px}.hd h2{margin:0}
.more{color:var(--accent);font-weight:500;font-size:.92rem;white-space:nowrap}
.tcard{display:flex;flex-direction:column;gap:10px;padding:18px;border:1px solid var(--border);border-radius:var(--r);background:var(--surface);box-shadow:var(--shadow);transition:.15s}
.tcard:hover{transform:translateY(-2px);border-color:var(--accent)}
.tcard .top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.tcard .emoji{display:grid;place-items:center;width:48px;height:48px;border-radius:12px;background:var(--accent-soft);font-size:1.5rem}
.tcard h3{margin:0;font-size:1.02rem}.tcard p{margin:0;color:var(--muted);font-size:.9rem;flex:1}
.tag{padding:2px 10px;border-radius:99px;border:1px solid var(--border);color:var(--muted);font-size:.75rem}
.btn{display:inline-flex;justify-content:center;align-items:center;height:42px;padding-inline:18px;border-radius:10px;background:var(--accent);color:var(--accent-text);font-weight:700;font-size:.92rem;border:0;cursor:pointer}
.btn:hover{opacity:.9}.btn.ghost{background:var(--accent-soft);color:var(--accent)}
.crumbs{padding:20px 0 0;font-size:.88rem;color:var(--muted)}.crumbs a:hover{color:var(--accent)}
.phead{padding:16px 0 8px}.phead h1{margin:8px 0}.phead p{color:var(--muted);margin:0;max-width:640px}
.work{margin:20px 0;padding:40px 16px;border:2px dashed var(--border);border-radius:var(--r);background:var(--surface);text-align:center;color:var(--muted)}
.work .emoji{display:block;font-size:2.4rem;margin-bottom:8px}
.pill{display:inline-block;margin-top:10px;padding:2px 12px;border-radius:99px;background:var(--accent-soft);color:var(--accent);font-size:.8rem}
.filters{display:grid;gap:12px;margin-bottom:8px}
.count{color:var(--muted);font-size:.9rem;margin:4px 0 12px}
.page-head{padding:28px 0 8px}.page-head h1{font-size:clamp(1.4rem,5vw,2rem);margin:0 0 6px}.page-head p{margin:0;color:var(--muted)}
@media(min-width:640px){.filters{grid-template-columns:1fr auto;align-items:center}}
/* tool: image-compress */
.ic [hidden]{display:none!important}.ic small{color:var(--muted)}
.ic-drop{display:flex;flex-direction:column;align-items:center;gap:6px;padding:40px 16px;border:2px dashed var(--border);border-radius:var(--r);background:var(--surface);text-align:center;cursor:pointer;transition:.15s}
.ic-drop:hover,.ic-drop.over{border-color:var(--accent);background:var(--accent-soft)}.ic-drop .emoji{font-size:2.4rem}
.ic-err{margin:12px 0;padding:10px 14px;border-radius:10px;border:1px solid #e5484d;background:color-mix(in srgb,#e5484d 12%,var(--surface));color:#d92d20}
.ic-warn{margin:0;padding:10px 14px;border-radius:10px;background:var(--accent-soft);font-size:.9rem}
.ic-panel{display:grid;gap:16px;padding:16px;border:1px solid var(--border);border-radius:var(--r);background:var(--surface)}
.ic-file{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between}
.ic-file b{word-break:break-all;unicode-bidi:plaintext}
.ic-prev{display:grid;gap:12px;grid-template-columns:1fr}
.ic-prev figure{margin:0;border:1px solid var(--border);border-radius:12px;overflow:hidden;background:var(--bg)}
.ic-prev img{display:block;width:100%;height:220px;object-fit:contain}
.ic-prev figcaption{display:flex;justify-content:space-between;gap:8px;padding:8px 12px;border-top:1px solid var(--border);font-size:.85rem;color:var(--muted)}
.ic-ctrl{display:grid;gap:10px}.ic-ctrl label{display:flex;justify-content:space-between;font-weight:500}
.ic-ctrl input[type=range]{width:100%;accent-color:var(--accent)}
.ic-ctrl select{height:42px;padding-inline:10px;border-radius:10px;border:1px solid var(--border);background:var(--surface)}
.ic-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.ic-stats div{padding:10px 4px;border-radius:12px;background:var(--accent-soft)}.ic-stats small{display:block;font-size:.78rem}.ic-stats b{font-size:.92rem}
.ic-acts{display:flex;flex-wrap:wrap;gap:8px}.ic-acts .btn{flex:1;min-width:140px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.spin{display:inline-block;width:14px;height:14px;margin-inline-end:6px;border:2px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:sp .7s linear infinite;vertical-align:-2px}
@keyframes sp{to{transform:rotate(360deg)}}
@media(min-width:640px){.ic-prev{grid-template-columns:1fr 1fr}}
/* shared tool kit additions */
.ic-dims{display:grid;grid-template-columns:1fr 1fr;gap:12px}.ic-dims div{display:grid;gap:6px}
.ic-ctrl input[type=number],.ic-ctrl textarea{width:100%;height:42px;padding-inline:10px;border-radius:10px;border:1px solid var(--border);background:var(--surface)}
.ic-ctrl textarea{height:auto;padding:10px;resize:vertical;line-height:1.8}
.ic-ctrl label.chk{justify-content:flex-start;gap:8px;cursor:pointer}
.ic-prev textarea{display:block;width:100%;height:220px;padding:10px;border:0;background:var(--bg);resize:vertical;line-height:1.9}
.qr-out{display:grid;justify-items:center;gap:8px;padding:16px;border:1px solid var(--border);border-radius:12px;background:#fff;color:#555;font-size:.82rem}
.qr-out canvas{image-rendering:pixelated;max-width:100%;height:auto}
.ic-ok{background:color-mix(in srgb,#12b76a 14%,var(--surface))}
/* video / pdf tools */
.ic-prev video{display:block;width:100%;max-height:220px;background:#000}
.ic progress{width:100%;height:10px;accent-color:var(--accent)}
.ic .prog{display:grid;gap:6px}
/* footer */
footer{margin-top:32px;border-top:1px solid var(--border);background:var(--surface);padding:32px 0 24px;color:var(--muted);font-size:.9rem}
.fgrid{display:grid;gap:24px;grid-template-columns:1fr}
footer h2{font-size:1rem;color:var(--text);margin-bottom:8px}
footer ul{list-style:none;margin:0;padding:0}
footer li a:hover{color:var(--accent)}
.copy{margin-top:24px;padding-top:16px;border-top:1px solid var(--border);text-align:center}
#toast{position:fixed;inset-inline:16px;bottom:calc(20px + env(safe-area-inset-bottom,0px));max-width:360px;margin-inline:auto;padding:12px 16px;border-radius:12px;background:var(--text);color:var(--bg);text-align:center;opacity:0;pointer-events:none;transform:translateY(8px);transition:.2s}
#toast.on{opacity:1;transform:none}
@media(min-width:640px){.grid{grid-template-columns:repeat(3,1fr)}.tools{grid-template-columns:repeat(2,1fr)}.fgrid{grid-template-columns:2fr 1fr 1fr}}
@media(min-width:900px){nav{display:flex}.grid{grid-template-columns:repeat(5,1fr)}.tools{grid-template-columns:repeat(3,1fr)}.hero{padding:72px 0 40px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>
</head>

<main id="app"></main>

<footer>

<script>
/* ===== Shared toolkit ===== */
class UserError extends Error{}   /* پیام‌های قابل نمایش به کاربر */
const Kit = {
  scripts:{},
  loadScript(url){  /* بارگذاری تنبل کتابخانه‌ها، فقط هنگام نیاز */
    return Kit.scripts[url] || (Kit.scripts[url] = new Promise((ok,no)=>{
      const el=document.createElement('script'); el.src=url; el.onload=ok;
      el.onerror=()=>{delete Kit.scripts[url]; no(new UserError('بارگذاری کتابخانهٔ مورد نیاز ممکن نشد. اتصال اینترنت را بررسی کنید.'))};
      document.head.appendChild(el)}));
  },
  spin:t=>`<span class="spin"></span>${t}`,
  ext:{'image/jpeg':'jpg','image/png':'png','image/webp':'webp','text/plain':'txt'},
  baseName:n=>n.replace(/\.[^.]+$/,'')||'file',
  async save(blob, filename){  /* صفحهٔ منتشرشده: قابلیت downloads؛ سایت معمولی: لینک دانلود */
    let dl=null; try{ dl = window.claude?.use ? await window.claude.use('downloads') : null }catch(_){}
    if(dl){ await dl.save({filename, data:blob}); return }
    const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=filename;
    document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href),1000);
  },
  async copy(text, ta){
    try{ await navigator.clipboard.writeText(text); return true }catch(_){}
    try{ ta.focus(); ta.select(); return document.execCommand('copy') }catch(_){ return false }
  }
};
const fmtBytes = b => b<1024 ? fa(b)+' بایت' : b<1048576 ? (b/1024).toLocaleString('fa-IR',{maximumFractionDigits:1})+' کیلوبایت' : (b/1048576).toLocaleString('fa-IR',{maximumFractionDigits:2})+' مگابایت';
const canWebp = document.createElement('canvas').toDataURL('image/webp').startsWith('data:image/webp');
const FMT = {jpeg:['image/jpeg','JPG (سازگار با همه‌جا)'], png:['image/png','PNG (بدون افت کیفیت، پشتیبانی از شفافیت)'], webp:['image/webp','WebP (حجم کم)']};
const FMT_NAME = {'image/jpeg':'JPG','image/png':'PNG','image/webp':'WebP'};
const fmtOpts = keys => keys.map(k=>FMT[k]).filter(([v])=>canWebp||v!=='image/webp');
const Ctl = {  /* کنترل‌های مشترک */
  quality:(v=80)=>`<label for="q"><span>کیفیت تصویر</span><b id="qv">${fa(v)}٪</b></label><input id="q" type="range" min="10" max="100" step="5" value="${v}"><small>کیفیت کمتر یعنی حجم کمتر (برای PNG اعمال نمی‌شود).</small>`,
  format:opts=>`<label for="fmt"><span>فرمت خروجی</span></label><select id="fmt">${opts.map(([v,t])=>`<option value="${v}">${t}</option>`).join('')}</select>`
};
const ImageEngine = {  /* موتور خالص، بدون وابستگی به UI */
  MAX_BYTES: 30*1024*1024,
  TYPES: ['image/jpeg','image/png','image/webp','image/gif','image/bmp','image/avif'],
  validate(f){
    if(!f) return 'فایلی انتخاب نشده است.';
    if(!this.TYPES.includes(f.type)) return 'فرمت فایل پشتیبانی نمی‌شود. لطفاً تصویر JPG، PNG، WebP، GIF، BMP یا AVIF انتخاب کنید.';
    if(!f.size) return 'فایل خالی است.';
    if(f.size>this.MAX_BYTES) return 'حجم فایل بیش از ۳۰ مگابایت است.';
    return null;
  },
  async decode(f){
    if('createImageBitmap' in window){ try{ return await createImageBitmap(f) }catch(_){} }
    return new Promise((ok,no)=>{const u=URL.createObjectURL(f),i=new Image();
      i.onload=()=>{URL.revokeObjectURL(u);ok(i)}; i.onerror=()=>{URL.revokeObjectURL(u);no(new UserError('این فایل قابل خواندن نیست یا آسیب دیده است.'))}; i.src=u});
  },
  draw(src,w,h,bg){
    const c=document.createElement('canvas'); c.width=w; c.height=h;
    const x=c.getContext('2d'); x.imageSmoothingEnabled=true; x.imageSmoothingQuality='high';
    if(bg){x.fillStyle='#fff';x.fillRect(0,0,w,h)}   /* JPEG شفافیت ندارد */
    x.drawImage(src,0,0,w,h); return c;
  },
  async encode(img,{quality=.8,mime,width=img.width,height=img.height}){
    if(!(width>=1&&height>=1)||width>16384||height>16384||width*height>1e8)
      throw new UserError('ابعاد خروجی خارج از محدودهٔ مجاز است (حداکثر ۱۶۳۸۴ پیکسل و ۱۰۰ مگاپیکسل).');
    let src=img, sw=img.width, sh=img.height;
    while(sw>width*2||sh>height*2){   /* کوچک‌کردن مرحله‌ای برای کیفیت بهتر */
      const nw=Math.max(width,Math.ceil(sw/2)), nh=Math.max(height,Math.ceil(sh/2));
      src=this.draw(src,nw,nh,false); sw=nw; sh=nh;
    }
    const c=this.draw(src,width,height,mime==='image/jpeg');
    const blob=await new Promise(r=>c.toBlob(r,mime,quality));
    if(!blob||blob.type!==mime) throw new UserError('مرورگر شما این فرمت خروجی را پشتیبانی نمی‌کند؛ فرمت دیگری را انتخاب کنید.');
    return blob;
  }
};
/* ===== کارخانهٔ ابزار تصویری: ورودی تصویر + کنترل‌ها + نتیجه + دانلود ===== */
const IMG_RESULT = `<img id="pb" alt="پیش‌نمایش نتیجه"><figcaption><span>نتیجه</span><span id="st" aria-live="polite"></span></figcaption>`;
function imageTool(cfg){
  return function(root){
    root.className='ic';
    root.innerHTML = `
    <div class="ic-drop" id="drop" role="button" tabindex="0" aria-label="انتخاب یا رها کردن تصویر">
      <span class="emoji" aria-hidden="true">🖼️</span><b>تصویر را اینجا رها کنید یا برای انتخاب فایل کلیک کنید</b>
      <small>JPG، PNG، WebP، GIF، BMP و AVIF تا ۳۰ مگابایت</small>
      <small>🔒 پردازش کاملاً در مرورگر شما انجام می‌شود و تصویر جایی آپلود نمی‌شود.</small></div>
    <input id="file" type="file" accept="${ImageEngine.TYPES.join(',')}" hidden>
    <p class="ic-err" id="err" role="alert" hidden></p>
    <div class="ic-panel" id="panel" hidden>
      <div class="ic-file"><span>فایل: <b id="name"></b></span>
        <span class="ic-acts"><button class="btn ghost" id="again" type="button">انتخاب فایل جدید</button><button class="btn ghost" id="del" type="button">حذف فایل</button></span></div>
      <div class="ic-prev">

    const q = s => root.querySelector(s), errEl = q('#err');

      get file(){return S.file}, get img(){return S.img},
      busy(m){ q('#st').innerHTML=Kit.spin(m)+'<small class="sec"></small>'; q('#dl').disabled=true; gate(false); const g=q('#go'); if(g) g.disabled=true },
      showImage(blob){ S.b&&URL.revokeObjectURL(S.b); S.b=URL.createObjectURL(blob); q('#pb').src=S.b },

      done(stats,warn){

        const w=q('#warn'); w.textContent=warn||''; w.hidden=!warn;
        q('#st').textContent='✓ '+(cfg.readyText||'آماده'); q('#dl').disabled=false; gate(true);
      }};
    const free = () => { clearTimeout(S.t); S.seq++; S.worker?.terminate?.(); S.abort?.abort(); S.img?.close?.(); [S.a,S.b].forEach(u=>u&&URL.revokeObjectURL(u)); Object.assign(S,{file:null,img:null,a:null,b:null,out:null,worker:null}) };
    const sync = () => { const qq=q('#q'); if(qq){ q('#qv').textContent=fa(+qq.value)+'٪'; const f=q('#fmt'); qq.disabled = !!f && f.value==='image/png' } };
    function reset(){ free(); q('#panel').hidden=true; q('#drop').hidden=false; q('#file').value=''; err('') }

    async function load(file){
      err(''); const m=ImageEngine.validate(file); if(m) return err(m);

      q('#pb')?.removeAttribute('src'); const ta=q('#ocr'); if(ta) ta.value='';

      q('#pa').src=S.a; q('#name').textContent=file.name; q('#osz').textContent=fmtBytes(file.size); q('#dim').textContent=`${fa(img.width)}×${fa(img.height)}`;
      q('#st').textContent=''; gate(true); cfg.init?.(c); sync();
      if(cfg.auto!==false) run(); else { const g=q('#go'); if(g) g.disabled=false }
    }
    async function imageRun(){
      const p=cfg.plan(c), blob=await ImageEngine.encode(S.img,p.opts); if(!c.alive()) return;
      c.showImage(blob); c.setOut(blob, Kit.baseName(S.file.name)+p.suffix+'.'+Kit.ext[blob.type]); c.done(p.stats(blob), p.warn?.(blob));

    async function run(){
      if(!S.img) return; const my=++S.seq; c.alive=()=>my===S.seq; err(''); c.busy(cfg.busyText||'در حال پردازش…');
      try{ await (cfg.run ? cfg.run(c) : imageRun()) }

        q('#st').textContent=''; err(e instanceof UserError ? e.message : (cfg.failMsg||'پردازش انجام نشد؛ دوباره تلاش کنید.')); gate(true); const g=q('#go'); if(g) g.disabled=false }
    }

    drop.onclick=()=>input.click();
    drop.onkeydown=e=>{ if(e.key==='Enter'||e.key===' '){e.preventDefault();input.click()} };
    drop.ondragover=e=>{e.preventDefault();drop.classList.add('over')};
    drop.ondragleave=()=>drop.classList.remove('over');
    drop.ondrop=e=>{e.preventDefault();drop.classList.remove('over');load(e.dataTransfer.files[0])};
    input.onchange=()=>{const f=input.files[0]; input.value=''; if(f) load(f)};
    q('#again').onclick=()=>input.click(); q('#del').onclick=reset;
    q('#ctrl').addEventListener('input',e=>{ cfg.onInput?.(e,c); sync(); if(cfg.auto!==false){clearTimeout(S.t);S.t=setTimeout(run,250)} });
    const go=q('#go'); if(go) go.onclick=run;
    q('#dl').onclick=async()=>{ if(!S.out) return; err('');
      try{ await Kit.save(S.out.blob,S.out.name) }catch(e){ if(e?.code!=='declined') err('ذخیرهٔ فایل انجام نشد. لطفاً دوباره تلاش کنید.') } };
    cfg.setup?.(c);
    return free;
  };
}

const OCR = {  /* برای میزبانی داخلی، فقط همین آدرس‌ها را عوض کنید */
  lib:'https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js',
  langPath:'https://tessdata.projectnaptha.com/4.0.0',
  status:{'loading tesseract core':'بارگذاری موتور OCR','loading language traineddata':'دانلود داده زبان','initializing api':'آماده‌سازی','recognizing text':'تشخیص متن'}

const withTimeout=(p,ms,msg)=>Promise.race([p,new Promise((_,no)=>setTimeout(()=>no(new UserError(msg)),ms))]);
/* موتور Claude: از قابلیت sample صفحه استفاده می‌کند و فقط با اجازهٔ صریح کاربر تصویر را ارسال می‌کند */
async function ocrWithClaude(c,langLabel){
  const sample = window.claude?.use ? await window.claude.use('sample').catch(()=>null) : null;
  if(!sample) throw new UserError('روش Claude فقط داخل خود claude.ai در دسترس است.');
  const caps = await withTimeout(sample.limits(),15000,'x').catch(()=>null);
  if(!caps?.images) throw new UserError('ارسال تصویر به Claude در این نمایش پشتیبانی نمی‌شود.');
  let img=c.file;
  if(!caps.images.mediaTypes.includes(img.type)||img.size>caps.images.maxInputBytes){   /* تبدیل به JPEG سازگار */
    const k=Math.min(1,2400/Math.max(c.img.width,c.img.height));
    img=await ImageEngine.encode(c.img,{mime:'image/jpeg',quality:.92,width:Math.round(c.img.width*k),height:Math.round(c.img.height*k)});
  }
  const prompt=`متن داخل این تصویر را دقیق و کامل استخراج کن. زبان متن: ${langLabel}. ترتیب خواندن و شکست خطوط را حفظ کن. فقط خود متن را بنویس، بدون توضیح، بدون قالب مارک‌داون و بدون ترجمه. اگر هیچ متنی در تصویر نیست فقط بنویس: NO_TEXT`;
  try{
    const r=await sample(prompt,{images:img, cache:false, modelTier:'quick', signal:c.S.abort.signal,
      onText:({text})=>{ if(c.alive()){ c.q('#ocr').value=text; c.q('#st').innerHTML=Kit.spin('Claude در حال نوشتن متن…') } }});
    return r.text.trim();
  }catch(e){
    if(e?.code==='not_granted') throw new UserError('اجازهٔ ارسال تصویر به Claude داده نشد.');
    if(e?.code==='cancelled') throw new UserError('پاسخ Claude بیش از حد طول کشید؛ دوباره تلاش کنید.');
    if(e?.code==='rate_limited') throw new UserError('تعداد درخواست‌ها زیاد است؛ کمی بعد دوباره تلاش کنید.');
    throw new UserError('استخراج متن با Claude انجام نشد؛ دوباره تلاش کنید.');
  }
}
const mountImageOcr = imageTool({
  auto:false, dlLabel:'دانلود متن (TXT)', readyText:'متن استخراج شد', busyText:'در حال آماده‌سازی…',
  failMsg:'استخراج متن انجام نشد؛ دوباره تلاش کنید.',
  result:`<textarea id="ocr" dir="auto" readonly aria-label="متن استخراج‌شده" placeholder="متن استخراج‌شده اینجا نمایش داده می‌شود"></textarea><figcaption><span>متن استخراج‌شده</span><span id="st" aria-live="polite"></span></figcaption>`,
  controls:()=>`<label for="engine"><span>روش استخراج</span></label>
    <select id="engine"><option value="device">روی دستگاه شما (Tesseract) — تصویر ارسال نمی‌شود</option><option value="claude">هوش مصنوعی Claude — دقیق‌تر، اما تصویر برای پردازش به Claude ارسال می‌شود</option></select>
    <label for="lang"><span>زبان متن تصویر</span></label><select id="lang"><option value="fas+eng">فارسی + انگلیسی</option><option value="fas">فارسی</option><option value="eng">انگلیسی</option></select>
    <small>روش «روی دستگاه» بار اول چند مگابایت داده زبان دانلود می‌کند و ممکن است در بعضی محیط‌ها به‌خاطر محدودیت شبکه اجرا نشود.</small>
    <button class="btn" id="go" type="button">شروع استخراج متن</button>`,
  actions:`<button class="btn ghost" id="copy" type="button" disabled>کپی متن</button><button class="btn ghost" id="stop" type="button" hidden>توقف پردازش</button>`,
  setup:c=>{ c.q('#stop').onclick=()=>{ c.S.seq++; c.S.abort?.abort(); c.S.worker?.terminate?.(); c.S.worker=null; c.q('#st').textContent='متوقف شد'; c.q('#stop').hidden=true; c.gate(true); c.q('#go').disabled=false };
    c.q('#copy').onclick=async()=>{ const ta=c.q('#ocr'), b=c.q('#copy'); if(!ta.value) return;
    if(await Kit.copy(ta.value,ta)){ b.textContent='✓ کپی شد'; setTimeout(()=>b.textContent='کپی متن',1500) } else c.err('کپی خودکار ممکن نشد؛ متن را انتخاب و دستی کپی کنید.') } },
  async run(c){
    const t0=Date.now(), tick=setInterval(()=>{ const e=c.q('#st .sec'); if(e) e.textContent=' ('+fa(Math.floor((Date.now()-t0)/1000))+' ثانیه)' },1000);
    c.S.abort=new AbortController(); const hard=setTimeout(()=>c.S.abort.abort(),120000); c.q('#stop').hidden=false;
    try{ await this.work(c) } finally { clearInterval(tick); clearTimeout(hard); c.q('#stop').hidden=true }
  },
  async work(c){
    const engine=c.q('#engine').value, langV=c.q('#lang').value, ta=c.q('#ocr'); let text='', stats;
    ta.value='';
    if(engine==='claude'){
      c.busy('در حال اتصال به Claude… (ممکن است از شما اجازه بخواهد)');
      text=await ocrWithClaude(c,c.q('#lang').selectedOptions[0].textContent); if(!c.alive()) return;
      if(text==='NO_TEXT') text='';
      stats=[['روش','Claude']];
    } else {
      let worker;
      try{
        c.busy('در حال بارگذاری موتور OCR…');
        await withTimeout(Kit.loadScript(OCR.lib),20000,'بارگذاری موتور OCR طول کشید.'); if(!c.alive()) return;
        worker=c.S.worker=await withTimeout(Tesseract.createWorker(langV,1,{langPath:OCR.langPath,
          logger:m=>{ if(c.alive()&&m.progress!=null) c.busy(`${OCR.status[m.status]||'در حال پردازش'} ${fa(Math.round(m.progress*100))}٪`) }}),60000,'آماده‌سازی موتور OCR طول کشید.');
        const {data}=await worker.recognize(c.file); if(!c.alive()) return;
        text=(data.text||'').trim(); stats=[['اطمینان',fa(Math.round(data.confidence))+'٪']];
      }catch(e){
        if(!c.alive()) return; console.error(e);
        c.q('#engine').value='claude';   /* پیشنهاد روش جایگزین */
        throw new UserError('اجرای OCR روی دستگاه در این محیط ممکن نشد (احتمالاً به‌دلیل محدودیت شبکه یا Worker). روش «Claude» انتخاب شد؛ اگر با ارسال تصویر به Claude مشکلی ندارید، دوباره «شروع استخراج متن» را بزنید.');
      }finally{ try{ await worker?.terminate() }catch(_){} if(c.S.worker===worker) c.S.worker=null }
    }
    if(!text) throw new UserError('متنی در تصویر پیدا نشد. تصویر واضح‌تر یا زبان دیگری را امتحان کنید.');
    ta.value=text; c.setOut(new Blob([text],{type:'text/plain'}), Kit.baseName(c.file.name)+'-text.txt');
    c.done([['تعداد کلمه',fa(text.split(/\s+/).filter(Boolean).length)],['تعداد نویسه',fa(text.length)],...stats]);
  }
});

    <div class="ic-acts"><button class="btn" id="dl" type="button" disabled>دانلود QR Code (PNG)</button><button class="btn ghost" id="clr" type="button">پاک کردن و ساخت جدید</button></div></div>`;
  const q=s=>root.querySelector(s); let seq=0, t=null;

    const show=on=>{q('#out').hidden=!on;q('#hint').hidden=on;q('#dl').disabled=!on; if(!on) q('#chk').hidden=true};

function fileTool(cfg){
  return function(root){
    root.className='ic';
    root.innerHTML=`

      <span class="emoji" aria-hidden="true">${cfg.icon}</span><b>${cfg.dropText}</b><small>${cfg.hint}</small>
      <small>🔒 پردازش در مرورگر شما انجام می‌شود و فایل جایی آپلود نمی‌شود.</small></div>
    <input id="file" type="file" accept="${cfg.accept}" hidden>
    <p class="ic-err" id="err" role="alert" hidden></p>
    <div class="ic-panel" id="panel" hidden>
      <div class="ic-file"><span>فایل: <b id="name"></b> · <span id="osz"></span></span>
        <span class="ic-acts"><button class="btn ghost" id="again" type="button">انتخاب فایل جدید</button><button class="btn ghost" id="del" type="button">حذف فایل</button></span></div>
      ${cfg.prev?`<div class="ic-prev">${cfg.prev}</div>`:''}
      <div class="ic-ctrl" id="ctrl">${cfg.controls()}</div>
      <p class="ic-warn">${cfg.note}</p>
      <div class="prog" id="prog" hidden role="status"><progress id="pg" max="100" value="0"></progress><small id="pt"></small></div>
      <div class="ic-stats" id="stats" hidden>${[0,1,2].map(i=>`<div><small id="l${i}"></small><b id="v${i}"></b></div>`).join('')}</div>
      <p class="ic-warn" id="warn" hidden></p>
      <div class="ic-acts"><button class="btn" id="go" type="button">${cfg.goLabel}</button><button class="btn ghost" id="stop" type="button" hidden>توقف پردازش</button><button class="btn" id="dl" type="button" disabled>${cfg.dlLabel}</button></div>
    </div>`;
    const q=s=>root.querySelector(s), S={file:null,out:null,urls:[],seq:0,stop:null};
    const err=m=>{const e=q('#err');e.textContent=m||'';e.hidden=!m};
    const c={q,S,err,alive:()=>true, get file(){return S.file},
      url(b){const u=URL.createObjectURL(b);S.urls.push(u);return u},
      progress(p,t){q('#prog').hidden=false;q('#pg').value=p;q('#pt').textContent=t||''},
      onStop(fn){S.stop=fn},
      setOut(blob,name){S.out={blob,name}},
      done(stats,warn){ stats.forEach(([l,v],i)=>{q('#l'+i).textContent=l;q('#v'+i).textContent=v}); q('#stats').hidden=false;
        const w=q('#warn'); w.textContent=warn||''; w.hidden=!warn; q('#dl').disabled=false }};
    const free=()=>{ S.seq++; try{S.stop?.()}catch(_){} S.stop=null; S.urls.forEach(u=>URL.revokeObjectURL(u)); Object.assign(S,{file:null,out:null,urls:[]}) };
    const idle=()=>{ q('#stop').hidden=true; q('#prog').hidden=true; q('#go').disabled=false };
    function reset(){ free(); q('#panel').hidden=true; q('#drop').hidden=false; q('#file').value=''; err('') }
    async function load(file){
      err(''); if(!file) return;
      const m=await cfg.validate(file); if(m) return err(m);
      free(); S.file=file; q('#drop').hidden=true; q('#panel').hidden=false; q('#stats').hidden=true; q('#warn').hidden=true; idle(); q('#dl').disabled=true;
      q('#name').textContent=file.name; q('#osz').textContent=fmtBytes(file.size);
      try{ await cfg.onFile?.(c) }catch(e){ if(S.file===file){ reset(); err(e instanceof UserError?e.message:'فایل خوانده نشد.') } }
    }
    async function run(){
      if(!S.file) return; const my=++S.seq; c.alive=()=>my===S.seq; err('');
      q('#go').disabled=true; q('#dl').disabled=true; q('#stats').hidden=true; q('#warn').hidden=true; q('#stop').hidden=false; c.progress(0,'در حال آماده‌سازی…');
      try{ await cfg.run(c) }
      catch(e){ if(my!==S.seq) return; if(!(e instanceof UserError)) console.error(e); err(e instanceof UserError?e.message:'پردازش انجام نشد؛ دوباره تلاش کنید.') }
      finally{ if(my===S.seq) idle() }
    }
    const drop=q('#drop'), input=q('#file');
    drop.onclick=()=>input.click();
    drop.onkeydown=e=>{ if(e.key==='Enter'||e.key===' '){e.preventDefault();input.click()} };
    drop.ondragover=e=>{e.preventDefault();drop.classList.add('over')};
    drop.ondragleave=()=>drop.classList.remove('over');

    input.onchange=()=>{const f=input.files[0]; input.value=''; if(f) load(f)};

    q('#stop').onclick=()=>{ S.seq++; try{S.stop?.()}catch(_){} S.stop=null; idle(); const w=q('#warn'); w.textContent='پردازش متوقف شد.'; w.hidden=false };
    q('#dl').onclick=async()=>{ if(!S.out) return; err('');
      try{ await Kit.save(S.out.blob,S.out.name) }catch(e){ if(e?.code!=='declined') err('ذخیرهٔ فایل انجام نشد. لطفاً دوباره تلاش کنید.') } };
    return free;
  };
}

  async validate(f){

  async onFile(c){

const mountPdfCompress = fileTool({
  icon:'📄', dropText:'فایل PDF را اینجا رها کنید یا برای انتخاب فایل کلیک کنید', hint:'فایل PDF — حداکثر ۱۰۰ مگابایت و ۳۰۰ صفحه',
  accept:'application/pdf,.pdf', goLabel:'شروع فشرده‌سازی', dlLabel:'دانلود PDF فشرده‌شده',
  controls:()=>`<label for="pq"><span>کیفیت خروجی</span></label><select id="pq"><option value="1,0.5">حجم کمتر (وضوح پایین‌تر)</option><option value="1.5,0.65" selected>متعادل</option><option value="2,0.8">کیفیت بالا</option></select>`,
  note:'محدودیت فنی: فشرده‌سازی PDF در مرورگر با تبدیل هر صفحه به تصویر JPEG انجام می‌شود. بنابراین در فایل خروجی متن قابل انتخاب و جستجو نیست و لینک‌ها و فرم‌ها حذف می‌شوند. این روش برای PDFهای اسکن‌شده و پرتصویر مؤثر است؛ PDFهای متنی ممکن است بزرگ‌تر شوند (در این صورت هشدار می‌دهیم).',
  async validate(f){

const ToolCard = t => `<article class="tcard">
  <div class="top"><span class="emoji" aria-hidden="true">${t.icon}</span><span class="tag">${catOf(t.cat).title}</span></div>
  <h3>${esc(t.title)}</h3><p>${esc(t.desc)}</p>
  ${t.soon?`<a class="btn ghost" href="#/tool/${t.slug}" aria-label="${esc(t.title)} به‌زودی">به‌زودی</a>`:`<a class="btn" href="#/tool/${t.slug}" aria-label="استفاده از ابزار ${esc(t.title)}">استفاده از ابزار</a>`}
</article>`;
const CatChips = (cur) => [{id:'all',title:'همه'},...CATEGORIES].map(c=>`<button class="chip" data-cat="${c.id}" aria-pressed="${cur===c.id}">${c.title}</button>`).join('');
const Empty = msg => `<div class="empty" style="grid-column:1/-1">${msg}</div>`;

/* ===== Views ===== */
function HomeView(){
  seo('ابزارهای آنلاین رایگان تولیدکنندگان محتوا','مجموعه ابزارهای آنلاین و رایگان فارسی برای تولیدکنندگان محتوا: عکس، ویدیو، PDF، متن و تولید محتوا، بدون نیاز به نصب و ثبت‌نام.');
  app.innerHTML = `<div class="wrap">
  <section class="hero" aria-labelledby="hero-title">
    <span class="badge">رایگان و بدون ثبت‌نام</span>
    <h1 id="hero-title">ابزارهای آنلاین رایگان برای تولیدکنندگان محتوا</h1>
    <p>ویرایش عکس، کار با ویدیو و PDF، نوشتن و تولید محتوا؛ همه در یک جا، سریع و به فارسی.</p>
    <div class="search" role="search"><span aria-hidden="true">🔍</span>
      <input id="hq" type="search" placeholder="جستجوی ابزار… مثلاً «کاهش حجم عکس»" aria-label="جستجوی ابزارها" autocomplete="off"></div>
  </section>
  <section aria-labelledby="cat-title"><h2 id="cat-title">دسته‌بندی ابزارها</h2>
    <div class="grid">${CATEGORIES.map(c=>`<a class="cat" href="#/tools?cat=${c.id}"><span class="emoji" aria-hidden="true">${c.icon}</span><b>${c.title}</b><small>${fa(TOOLS.filter(t=>t.cat===c.id).length)} ابزار</small></a>`).join('')}</div></section>
  <section aria-labelledby="pop-title"><div class="hd"><h2 id="pop-title">ابزارهای محبوب</h2><a class="more" href="#/tools">مشاهدهٔ همه ←</a></div>
    <div class="tools">${TOOLS.filter(t=>t.popular).map(ToolCard).join('')}</div></section></div>`;
}
let F = {cat:'all', q:''};
function ToolsView(params){
  F = {cat: catOf(params.get('cat')) ? params.get('cat') : 'all', q: params.get('q')||''};
  seo('همهٔ ابزارها','فهرست کامل ابزارهای آنلاین رایگان برای تولید محتوا: ابزارهای تصویر، ویدیو، PDF، متن و تولید محتوا با جستجو و فیلتر دسته‌بندی.');
  app.innerHTML = `<div class="wrap">
  <div class="page-head"><h1>همهٔ ابزارها</h1><p>ابزار مورد نیازتان را جستجو کنید یا بر اساس دسته‌بندی فیلتر کنید.</p></div>
  <section aria-label="جستجو و فیلتر"><div class="filters">
    <div class="search" style="margin:0;max-width:none" role="search"><span aria-hidden="true">🔍</span>
      <input id="tq" type="search" value="${esc(F.q)}" placeholder="جستجوی ابزار…" aria-label="جستجوی ابزارها" autocomplete="off"></div></div>
    <div class="chips" id="chips" role="group" aria-label="فیلتر دسته‌بندی"></div></section>
  <section aria-label="فهرست ابزارها"><p class="count" id="count" aria-live="polite"></p><div class="tools" id="list"></div></section></div>`;
  $('#tq').value = F.q; updateList();
}
function updateList(){
  const q = norm(F.q);
  const list = TOOLS.filter(t=>(F.cat==='all'||t.cat===F.cat)&&(!q||norm(t.title+' '+t.desc+' '+catOf(t.cat).title).includes(q)));
  $('#chips').innerHTML = CatChips(F.cat);
  $('#count').textContent = fa(list.length)+' ابزار';
  $('#list').innerHTML = list.length ? list.map(ToolCard).join('')
    : Empty(F.q ? 'ابزاری با این جستجو پیدا نشد.' : 'ابزارهای این دسته به‌زودی اضافه می‌شوند.');
}
function ToolView(slug){
  const t = TOOLS.find(x=>x.slug===slug);
  if(!t) return NotFound();
  const c = catOf(t.cat);
  seo(t.title, t.desc+' ابزار آنلاین و رایگان.');
  const related = TOOLS.filter(x=>x.slug!==t.slug).slice(0,3);
  app.innerHTML = `<div class="wrap">
  <nav class="crumbs" aria-label="مسیر"><a href="#/">خانه</a> ‹ <a href="#/tools">همهٔ ابزارها</a> ‹ <a href="#/tools?cat=${c.id}">${c.title}</a></nav>
  <header class="phead"><span class="tag">${c.title}</span><h1>${esc(t.title)}</h1><p>${esc(t.desc)}</p></header>
  <section aria-label="محیط ابزار"><div class="work" id="tool-root"><span class="emoji" aria-hidden="true">${t.icon}</span>
    <b>محیط کار ابزار «${esc(t.title)}»</b><br><span class="pill">به‌زودی</span></div></section>
  <section aria-labelledby="rel"><h2 id="rel">ابزارهای مرتبط</h2><div class="tools">${related.map(ToolCard).join('')}</div></section></div>`;
  if(typeof t.mount==='function') cleanup = t.mount($('#tool-root'), t) || null;
}
function NotFound(){
  seo('صفحه پیدا نشد','صفحهٔ درخواستی پیدا نشد.');
  app.innerHTML = `<div class="wrap"><div class="page-head"><h1>صفحه پیدا نشد</h1><p>آدرس درخواستی وجود ندارد.</p><p><a class="btn" href="#/tools" style="margin-top:16px">مشاهدهٔ همهٔ ابزارها</a></p></div></div>`;
}
/* ===== Router (hash-based؛ در پروژهٔ واقعی با مسیرهای فایل‌محور جایگزین می‌شود) ===== */
let cleanup=null;
function route(){
  if(cleanup){cleanup();cleanup=null}
  const [path, qs=''] = (location.hash.replace(/^#/,'')||'/').split('?');
  const params = new URLSearchParams(qs), parts = path.split('/').filter(Boolean);
  if(!parts.length) HomeView();
  else if(parts[0]==='tools') ToolsView(params);
  else if(parts[0]==='tool' && parts[1]) ToolView(decodeURIComponent(parts[1]));
  else NotFound();
  window.scrollTo(0,0);
}
addEventListener('hashchange', route);
/* ===== Events ===== */
document.addEventListener('click',e=>{
  const c = e.target.closest('.chip[data-cat]');
  if(c){F.cat=c.dataset.cat;updateList()}
});
document.addEventListener('input',e=>{ if(e.target.id==='tq'){F.q=e.target.value;updateList()} });
document.addEventListener('keydown',e=>{
  if(e.key==='Enter' && e.target.id==='hq'){ location.hash = '#/tools?q='+encodeURIComponent(e.target.value) }
});
$('#theme').addEventListener('click',()=>{
  const de=document.documentElement;
  const dark = de.dataset.theme==='dark' || (!de.dataset.theme && matchMedia('(prefers-color-scheme: dark)').matches);
  const next = dark?'light':'dark'; de.dataset.theme=next;
  try{localStorage.setItem('theme',next)}catch(_){}
});
try{const s=localStorage.getItem('theme');if(s)document.documentElement.dataset.theme=s}catch(_){}
route();
</script>
</body>
</html>
